<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="site-root" content="../../" />
  <title>Tamil Vanan — Senior DevOps & SRE Engineer</title>
  <meta name="description" content="Senior DevOps / SRE Engineer architecting GitOps-driven release automation, scalable Kubernetes infrastructure and cost-optimized multi-cloud foundations on AWS and Azure." />
  <meta name="theme-color" content="#f6f4ef" />
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../designs/executive/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="side__top">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 class="name" id="name"></h1>
        <p class="role" id="role"></p>
        <p class="intro" id="intro"></p>
        <nav class="toc" aria-label="Sections">
          <a href="#about"><i></i>About</a>
          <a href="#impact"><i></i>Impact</a>
          <a href="#experience"><i></i>Experience</a>
          <a href="#work"><i></i>Selected work</a>
          <a href="#expertise"><i></i>Expertise</a>
          <a href="#contact"><i></i>Contact</a>
        </nav>
      </div>
      <div class="side__bottom">
        <a class="btn" id="resume" target="_blank" rel="noopener"></a>
        <div class="social" id="social"></div>
      </div>
    </aside>

    <main class="content">
      <section id="about" class="block">
        <h2 class="label">About</h2>
        <div id="about-body" class="prose"></div>
        <blockquote class="pull" id="quote"></blockquote>
      </section>

      <section id="impact" class="block">
        <h2 class="label">Impact</h2>
        <div class="numbers" id="numbers"></div>
      </section>

      <section id="experience" class="block">
        <h2 class="label">Experience</h2>
        <ol class="jobs" id="jobs"></ol>
      </section>

      <section id="work" class="block">
        <h2 class="label">Selected work</h2>
        <p class="muted">Select a project to read the case study.</p>
        <ol class="projects" id="projects"></ol>
      </section>

      <section id="expertise" class="block">
        <h2 class="label">Expertise</h2>
        <div class="areas" id="areas"></div>
        <div class="skills" id="skills"></div>
        <div class="creds" id="creds"></div>
      </section>

      <section id="contact" class="block">
        <h2 class="label">Contact</h2>
        <p class="big">Have a platform that should <em>ship itself</em>? Let's talk.</p>
        <div class="contact" id="contact-links"></div>
      </section>

      <footer class="foot" id="foot"></footer>
    </main>
  </div>

  <script src="../../assets/content.js"></script>
  <script src="../../assets/shared.js"></script>
  <script src="../../designs/executive/app.js"></script>
</body>
</html>
