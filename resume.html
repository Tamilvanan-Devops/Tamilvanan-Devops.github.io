<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil Vanan – Senior DevOps Engineer – Resume</title>
  <meta name="description" content="Resume of Tamil Vanan, Senior DevOps / Site Reliability Engineer: GitOps, Kubernetes, AWS, Azure, Terraform, CI/CD and FinOps." />
  <meta name="author" content="Tamil Vanan" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
  <style>
    /* Single-column, text-only layout: parses cleanly in applicant tracking systems (ATS). */
    :root { --ink: #0f172a; --soft: #1f2937; --muted: #4b5563; --rule: #cbd5e1; --accent: #1e3a8a; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; background: #05070f; font-family: Inter, "Segoe UI", Calibri, Arial, sans-serif; color: var(--soft); font-size: 9.7pt; line-height: 1.42; }
    a { color: inherit; text-decoration: none; }
    p { margin: 0; }

    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; padding: .8rem; background: rgba(5, 7, 15, .9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(148, 163, 184, .2); font-family: "Space Grotesk", sans-serif; }
    .toolbar a, .toolbar button { display: inline-flex; align-items: center; gap: .45rem; padding: .55rem 1rem; border-radius: 10px; border: 1px solid rgba(148, 163, 184, .3); background: rgba(255, 255, 255, .04); color: #e8eefb; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .toolbar .primary { background: #6d8dff; border-color: #6d8dff; color: #fff; }
    .toolbar a:hover, .toolbar button:hover { border-color: #3ccfff; }

    .page { width: 210mm; min-height: 297mm; margin: 1.5rem auto 3rem; padding: 12mm 14mm; background: #fff; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .6); }

    header { text-align: center; padding-bottom: 2.6mm; border-bottom: .6mm solid var(--accent); }
    h1 { margin: 0; font-size: 22pt; line-height: 1.1; font-weight: 700; letter-spacing: .01em; color: var(--ink); }
    .title { margin: 1mm 0 1.8mm; font-size: 11pt; font-weight: 600; color: var(--accent); }
    .contact { font-size: 8.9pt; color: var(--muted); line-height: 1.55; }
    .contact a:hover { color: var(--accent); text-decoration: underline; }

    h2 { break-after: avoid; margin: 4mm 0 1.6mm; padding-bottom: .7mm; border-bottom: .3mm solid var(--rule); font-size: 10.3pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .comp { margin-top: 1.6mm; font-size: 9.1pt; color: var(--ink); font-weight: 500; }

    .skills p { display: grid; grid-template-columns: 37mm 1fr; gap: 3mm; margin-bottom: .5mm; font-size: 9.1pt; }
    .skills b { color: var(--ink); font-weight: 600; }

    .org { margin-bottom: 2.6mm; }
    .org__head, .role__head, .row { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
    .org__head { break-after: avoid; }
    .org h3 { margin: 0; font-size: 10.8pt; font-weight: 700; color: var(--ink); }
    .org__head span, time { flex: none; font-size: 9pt; color: var(--muted); white-space: nowrap; }
    .role { margin-top: .9mm; }
    .role__head { break-after: avoid; }
    .role h4 { margin: 0; font-size: 10pt; font-weight: 600; color: var(--accent); }
    .role ul { margin: .7mm 0 0; padding-left: 4.6mm; }
    .role li { margin-bottom: .45mm; break-inside: avoid; }
    .role li::marker { color: var(--accent); }
    .tools { margin-top: .6mm; font-size: 8.6pt; color: var(--muted); }
    .tools b { color: var(--soft); font-weight: 600; }

    .row { margin-bottom: .8mm; }
    .row b { color: var(--ink); font-weight: 600; }

    @page { size: A4; margin: 11mm 13mm; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { margin: 0; padding: 0; box-shadow: none; width: auto; min-height: auto; }
    }
    @media screen and (max-width: 820px) {
      .page { width: auto; margin: 0; padding: 7vw 6vw; min-height: 0; }
      .skills p { grid-template-columns: 1fr; gap: 0; margin-bottom: 1.5mm; }
      .org__head, .role__head, .row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Resume actions">
    <a href="./">← Back to portfolio</a>
    <a class="primary" id="pdf" href="assets/Tamil-Vanan-Resume.pdf" download>Download PDF</a>
    <button type="button" id="print">Print</button>
  </nav>
  <main class="page" id="resume"></main>

  <script src="assets/content.js"></script>
  <script>
    (() => {
      const P = window.PORTFOLIO, pr = P.profile, R = P.resume || {};
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const pretty = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
      const span = (p) => p.replace(/\s*[—–]\s*/, " – ");
      const join = (parts) => parts.filter(Boolean).join(" &nbsp;|&nbsp; ");
      // Phone is never stored in content.js; build-resume.sh passes it as ?phone= for private copies.
      const phone = (new URLSearchParams(location.search).get("phone") || "").replace(/[^\d+\-() ]/g, "").trim();
      const L = pr.links;

      const contact1 = join([
        esc(pr.location),
        phone && `<a href="tel:${esc(phone.replace(/[^\d+]/g, ""))}">${esc(phone)}</a>`,
        L.email && `<a href="mailto:${esc(L.email)}">${esc(L.email)}</a>`,
      ]);
      const contact2 = join([
        L.linkedin && `<a href="${esc(L.linkedin)}">${esc(pretty(L.linkedin))}</a>`,
        L.github && `<a href="${esc(L.github)}">${esc(pretty(L.github))}</a>`,
        L.site && `<a href="${esc(L.site)}">${esc(pretty(L.site))}</a>`,
      ]);

      // Group consecutive roles at the same company so promotions read as one tenure.
      const orgs = [];
      for (const x of P.experience) {
        const last = orgs[orgs.length - 1];
        if (last && last.company === x.company) last.roles.push(x);
        else orgs.push({ company: x.company, location: x.location, roles: [x] });
      }
      const tenure = (o) => {
        const first = o.roles[o.roles.length - 1].period.split(/\s*[—–]\s*/)[0];
        const last = o.roles[0].period.split(/\s*[—–]\s*/)[1];
        return `${first} – ${last}`;
      };

      document.getElementById("resume").innerHTML = `
        <header>
          <h1>${esc(pr.name)}</h1>
          <p class="title">${esc(R.title || pr.role)}</p>
          <p class="contact">${contact1}<br>${contact2}</p>
        </header>

        <h2>Professional Summary</h2>
        <p>${esc(R.summary || pr.tagline)}</p>
        ${R.competencies?.length ? `<p class="comp">${R.competencies.map(esc).join(" &nbsp;•&nbsp; ")}</p>` : ""}

        <h2>Technical Skills</h2>
        <div class="skills">${(R.skills || []).map((g) => `<p><b>${esc(g.group)}:</b><span>${esc(g.items)}</span></p>`).join("")}</div>

        <h2>Professional Experience</h2>
        ${orgs.map((o) => `
          <section class="org">
            <div class="org__head"><h3>${esc(o.company)}</h3><span>${esc(o.location)}${o.roles.length > 1 ? ` &nbsp;|&nbsp; ${esc(tenure(o))}` : ""}</span></div>
            ${o.roles.map((x) => `
              <div class="role">
                <div class="role__head"><h4>${esc(x.role)}</h4><time>${esc(span(x.period))}</time></div>
                <ul>${x.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
                ${x.tags?.length ? `<p class="tools"><b>Tech:</b> ${x.tags.map(esc).join(", ")}</p>` : ""}
              </div>`).join("")}
          </section>`).join("")}

        <h2>Education &amp; Certifications</h2>
        <p class="row"><span><b>${esc(P.education.degree)}</b>, ${esc(P.education.school)}</span><time>${esc(span(P.education.period))}</time></p>
        ${P.certifications.map((c) => `<p class="row"><span><b>${esc(c.name)}</b>, ${esc(c.issuer)}</span><time>${esc(c.date)}</time></p>`).join("")}
        ${R.languages ? `<p class="row"><span><b>Languages:</b> ${esc(R.languages)}</span></p>` : ""}`;

      document.getElementById("print").addEventListener("click", () => print());
    })();
  </script>
</body>
</html>
